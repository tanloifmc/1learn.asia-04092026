name: Quality Gate

on:
  push:
    branches: [main, codex/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:env
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # Tạm thời vô hiệu hóa E2E tests trên Github Actions vì chưa cấu hình Secrets
      # - run: node ./node_modules/@playwright/test/cli.js install --with-deps chromium
      # - run: npm run test:e2e
